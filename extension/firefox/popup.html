<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; padding: 14px; font-family: -apple-system, sans-serif; font-size: 13px; }
    h2 { margin: 0 0 10px; font-size: 15px; color: #875a7b; }
    p { margin: 4px 0; color: #555; }
    .status { padding: 8px; border-radius: 4px; margin: 8px 0; font-size: 12px; }
    .ok { background: #dff0d8; color: #3c763d; }
    .err { background: #f2dede; color: #a94442; }
    .loading { background: #d9edf7; color: #31708f; }
    .idle { background: #f5f5f5; color: #888; }
    a { color: #875a7b; }
    .btn-stop {
      display: inline-block; margin-top: 8px; padding: 6px 16px;
      background: #e74c3c; color: #fff; border-radius: 4px;
      text-decoration: none; font-size: 12px; cursor: pointer;
    }
    .btn-stop:hover { background: #c0392b; }
    .btn-open {
      display: inline-block; margin-top: 8px; margin-right: 6px;
      padding: 6px 16px; background: #875a7b; color: #fff;
      border-radius: 4px; text-decoration: none; font-size: 12px;
    }
    .btn-open:hover { background: #6c4a63; }
    .actions { margin-top: 10px; }
    .meta { font-size: 11px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Odoo Runbot Local</h2>
  <div id="status" class="status loading">Checking server...</div>
  <p id="detail"></p>
  <div id="actions" class="actions" style="display:none;"></div>
  <p class="meta"><a href="https://runbot.odoo.com" target="_blank">Open runbot</a></p>
  <script>
    chrome.runtime.sendMessage({ action: 'status' }, (data) => {
      const el = document.getElementById('status');
      const detail = document.getElementById('detail');
      const actions = document.getElementById('actions');

      if (data._reachable === false) {
        el.className = 'status err';
        el.textContent = '● Server unreachable';
        detail.textContent = 'Is the server running? Restart via desktop icon or setup.sh';
      } else if (data.running && data.alive) {
        el.className = 'status ok';
        el.textContent = '● Running';
        const mins = Math.floor(data.uptime_seconds / 60);
        detail.textContent = `Branch: ${data.branch} | DB: ${data.db_name} | Uptime: ${mins}m`;
        actions.style.display = 'block';
        actions.innerHTML = `
          <a class="btn-open" href="http://localhost:8072" target="_blank">Open Odoo</a>
          <a class="btn-stop" id="popup-stop-btn">Stop</a>
        `;
        document.getElementById('popup-stop-btn').addEventListener('click', () => {
          chrome.runtime.sendMessage({ action: 'stop' }, (res) => {
            el.className = 'status idle';
            el.textContent = '○ Stopped';
            detail.textContent = 'Instance stopped';
            actions.style.display = 'none';
          });
        });
      } else {
        el.className = 'status idle';
        el.textContent = '○ Idle';
        detail.textContent = 'Click "Run locally" on a runbot bundle page';
      }
    });
  </script>
</body>
</html>
